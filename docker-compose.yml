services:
  # ------------------------------------------------------------
  # API .NET (Minimal API)
  #
  # En el VPS se conecta al PostgreSQL compartido que provee el
  # profesor (ver DB_HOST en .env). El PostgreSQL de desarrollo
  # vive en docker-compose.local.yml.
  # ------------------------------------------------------------
  web_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perfumes_api
    restart: always
    ports:
      - "${API_PORT:-5007}:5000"
      - "${ADMIN_PORT:-8087}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:5000
      - AppSettings__FeatureFlag_EnableDetailedLogs=${ENABLE_DETAILED_LOGS:-false}
      - DATABASE_TIMEOUT=${DATABASE_TIMEOUT:-30}
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST:-postgres_db};Port=${DB_INTERNAL_PORT:-5432};Database=${POSTGRES_DB:-appdb};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD}
    # Permite llegar a un PostgreSQL que escuche en el host del VPS
    # usando Host=host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
